name: Phase 0 checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: businessos
          POSTGRES_USER: businessos
          POSTGRES_PASSWORD: businessos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U businessos -d businessos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: businessos
      POSTGRES_USER: businessos
      POSTGRES_PASSWORD: businessos
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/development.lock
      - run: pip install -r requirements/development.lock
      - run: python manage.py migrate
      - run: pytest
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code -- static/css/tailwind.css

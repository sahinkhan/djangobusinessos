<header class="app-header sticky top-0 z-30">
  <div class="flex h-[4.5rem] min-w-0 items-center gap-2 px-4 sm:gap-4 sm:px-6 lg:px-10">
    <span class="shrink-0 lg:hidden">
      <button type="button" class="icon-button" x-ref="menuTrigger" @click="sidebarOpen = true; $nextTick(() => $refs.mobileSidebar.querySelector('[aria-label=&quot;Close navigation&quot;]').focus())" aria-label="Open navigation" aria-controls="mobile-sidebar" :aria-expanded="sidebarOpen.toString()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
      </button>
    </span>
    <div class="min-w-0 flex-1">
      <div class="hidden sm:block">
        <p class="truncate text-[11px] font-semibold uppercase tracking-[0.14em] text-slate-400">Business operations</p>
        <p class="truncate text-sm font-semibold text-slate-700">Company workspace</p>
      </div>
    </div>
    <div class="flex shrink-0 items-center gap-1.5 sm:gap-2">
      <a class="company-switch" href="{% url 'select_company' %}" data-app-nav aria-label="Switch company">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 21V7l8-4 8 4v14M8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01M9 21v-4h6v4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="hidden sm:block">
          <span class="block text-[10px] font-semibold uppercase tracking-[0.12em] text-slate-400">Current company</span>
          <span class="block text-xs font-semibold text-slate-700">Switch company</span>
        </span>
        <span class="text-xs font-semibold sm:hidden">Company</span>
      </a>
      <div class="mx-1 hidden h-7 w-px bg-slate-200 sm:block"></div>
      <div class="flex min-w-0 items-center gap-2 sm:gap-3">
        <span class="user-avatar" aria-hidden="true">{{ user.email|first|upper }}</span>
        <span class="hidden min-w-0 lg:block">
          <span class="block max-w-44 truncate text-sm font-semibold text-slate-700">{{ user.email }}</span>
          <span class="block text-[11px] text-slate-400">Workspace user</span>
        </span>
        <form method="post" action="{% url 'logout' %}" class="flex">
          {% csrf_token %}
          <button type="submit" class="icon-button" aria-label="Sign out" title="Sign out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-3M10 12h11m0 0-4-4m4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </div>
    </div>
  </div>
</header>

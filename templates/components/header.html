<header class="sticky top-0 z-30 flex h-16 items-center gap-4 border-b border-slate-200 bg-white bg-opacity-95 px-4 shadow-sm backdrop-blur sm:px-6 lg:px-8">
  <button class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 lg:hidden" @click="sidebarOpen = true" aria-label="Open navigation">☰</button>
  <div class="min-w-0 flex-1">
    <p class="truncate text-sm font-medium text-slate-500">Business operations workspace</p>
  </div>
  <div class="flex items-center gap-3">
    <a class="hidden text-sm font-semibold text-indigo-700 hover:text-indigo-900 sm:block" href="{% url 'select_company' %}">Company</a>
    <span class="hidden text-sm text-slate-600 sm:block">{{ user.email }}</span>
    <span class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-100 font-semibold text-indigo-700">{{ user.email|first|upper }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="text-sm font-medium text-slate-600 hover:text-slate-900">Sign out</button>
    </form>
  </div>
</header>

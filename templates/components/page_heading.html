<div class="page-heading">
  <div class="min-w-0 flex-1">
    {% if eyebrow %}<p class="page-heading-eyebrow">{{ eyebrow }}</p>{% endif %}
    <h1 class="page-heading-title">{{ heading }}</h1>
    {% if description %}<p class="page-heading-description">{{ description }}</p>{% endif %}
  </div>
  {% if action_label or secondary_action_label %}
    <div class="page-heading-actions">
      {% if secondary_action_label %}<a href="{{ secondary_action_url }}" data-app-nav class="btn-secondary">{{ secondary_action_label }}</a>{% endif %}
      {% if action_label %}<a href="{{ action_url }}" data-app-nav class="btn-primary">{{ action_label }}</a>{% endif %}
    </div>
  {% endif %}
</div>

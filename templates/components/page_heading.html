<div class="mb-6 flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
  <div class="min-w-0">
    <h1 class="text-2xl font-bold tracking-tight text-slate-950" style="overflow-wrap: anywhere;">{{ heading }}</h1>
    {% if description %}<p class="mt-1 text-sm text-slate-500">{{ description }}</p>{% endif %}
  </div>
  {% if action_label %}<a href="{{ action_url }}" class="btn-primary">{{ action_label }}</a>{% endif %}
</div>
